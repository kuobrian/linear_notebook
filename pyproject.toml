[project]
name = "local-linear"
version = "0.1.0"
description = "A local, Linear-style issue tracker built with FastAPI and SQLite"
readme = "README.md"
authors = [
    { name = "kuobrian", email = "kuobrian614@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "linkify-it-py>=2.2.0",
    "markdown-it-py>=4.2.0",
    "mcp>=2.3.0",
    "mdit-py-plugins>=0.6.1",
    "pydantic>=2.14.2",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
local-linear = "local_linear.main:main"
local-linear-mcp = "local_linear.mcp_server:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
